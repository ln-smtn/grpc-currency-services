app:
  version: ${APP_VERSION:1.0.0}

spring:
  application:
    name: currency-rate-provider
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    zookeeper:
      connect-string: ${ZOOKEEPER_HOST:localhost}:2181
      discovery:
        enabled: true
        register: true
        root: /services
        instance-port: ${grpc.server.port}
        metadata:
          grpc.port: ${grpc.server.port}

grpc:
  server:
    port: ${GRPC_PORT:9091}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: currency-rate-provider

currency:
  rate:
    base: 92.50
    max-jitter: 1.20