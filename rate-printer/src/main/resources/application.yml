app:
  version: ${APP_VERSION:1.0.0}

spring:
  application:
    name: rate-printer
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    zookeeper:
      connect-string: ${ZOOKEEPER_HOST:localhost}:2181
      discovery:
        enabled: true

grpc:
  client:
    currencyRateProvider:
      address: "discovery:///currency-rate-provider"
      negotiationType: PLAINTEXT

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: rate-printer